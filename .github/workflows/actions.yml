name: Build Orion firmware
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - name: Test latch and PD recovery
        run: |
          g++ -std=c++17 -Itest/battfix-host test/battfix-host/battfix_test.cpp -o /tmp/orion-battfix-tests
          /tmp/orion-battfix-tests
      - run: python -m platformio run -e BOARD_SOMATICVR_ORION
      - uses: actions/upload-artifact@v4
        with:
          name: orion-0.7.4-battfix-firmware
          path: |
            .pio/build/BOARD_SOMATICVR_ORION/firmware.hex
            .pio/build/BOARD_SOMATICVR_ORION/firmware.hex.sha256
            .pio/build/BOARD_SOMATICVR_ORION/firmware.bin
